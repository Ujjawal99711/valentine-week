<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🤗 Hug Day - For You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared-styles.css">
    <style>
        /* Hug Day Theme - Warm Orange + Peach */
        :root {
            --bg-gradient-start: #1a0f0a;
            --bg-gradient-end: #2d1a0f;
            --primary-color: #ff9800;
            --secondary-color: #ffe0b2;
            --text-color: #ffffff;
            --accent-color: #ffb74d;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 50%, #1a0a05 100%);
            color: var(--text-color);
        }

        .day-title {
            color: var(--primary-color);
            text-shadow: 0 2px 20px rgba(255, 152, 0, 0.5);
        }

        .day-date {
            color: var(--secondary-color);
        }

        .message-label {
            color: var(--accent-color);
        }

        .message-section {
            border: 1px solid rgba(255, 152, 0, 0.3);
            background: rgba(255, 152, 0, 0.08);
        }

        .quote-section {
            border-left-color: var(--primary-color);
            color: var(--secondary-color);
        }

        .polaroid-caption {
            color: #e65100;
        }

        /* Warm hugging hearts animation */
        .warm-heart {
            position: fixed;
            font-size: 20px;
            animation: hugFloat 10s ease-in-out infinite;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes hugFloat {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            10% { opacity: 0.7; }
            50% { transform: translateY(50vh) scale(1.2); }
            90% { opacity: 0.7; }
            100% {
                transform: translateY(-10vh) scale(0.8);
                opacity: 0;
            }
        }

        .day-emoji {
            animation: hugAnimation 1.5s ease-in-out infinite;
        }

        @keyframes hugAnimation {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15) rotate(-5deg); }
            75% { transform: scale(1.15) rotate(5deg); }
        }

        /* Warm glow effect */
        .page-container::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 152, 0, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <!-- Floating Elements -->
    <div class="hearts-container" id="hugContainer"></div>

    <!-- Main Content -->
    <div class="page-container">
        <!-- Header -->
        <div class="day-header">
            <span class="day-emoji">🤗</span>
            <h1 class="day-title">Hug Day</h1>
            <p class="day-date">February 12</p>
        </div>

        <!-- Polaroid Photo -->
        <div class="polaroid-container">
            <div class="polaroid">
                <div id="photoContainer">
                    <div class="polaroid-placeholder">🤗</div>
                </div>
                <p class="polaroid-caption" id="captionName">My Love</p>
            </div>
        </div>

        <!-- Message -->
        <div class="message-section">
            <p class="message-label">For you, <span id="displayName">My Love</span> 💕</p>
            <p class="message-text" id="messageText">
                In your arms is where I feel safest. Sending you the biggest, warmest, most loving hug!
            </p>
        </div>

        <!-- Quote -->
        <div class="quote-section">
            <p class="quote-text" id="quoteText">
                "A hug is like a boomerang - you get it back right away."
            </p>
        </div>

        <!-- Footer -->
        <div class="page-footer">
            <p class="footer-hearts">🤗🧡🤗</p>
            <p>Happy Hug Day!</p>
        </div>
    </div>

    <script src="../config.js"></script>
    <script>
        function createFloatingElements() {
            const container = document.getElementById('hugContainer');
            const elements = ['🤗', '🧡', '💛', '✨', '💕', '🫂'];
            
            for (let i = 0; i < 15; i++) {
                const el = document.createElement('div');
                el.className = 'warm-heart';
                el.textContent = elements[Math.floor(Math.random() * elements.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.animationDuration = (Math.random() * 5 + 8) + 's';
                el.style.animationDelay = Math.random() * 10 + 's';
                el.style.fontSize = (Math.random() * 12 + 16) + 'px';
                container.appendChild(el);
            }
        }

        function loadContent() {
            const config = ValentineConfig.getDay('hug');
            
            document.getElementById('displayName').textContent = config.name;
            document.getElementById('captionName').textContent = config.name;
            
            if (config.message) {
                document.getElementById('messageText').textContent = config.message;
            }
            
            if (config.quote) {
                document.getElementById('quoteText').textContent = config.quote;
            }
            
            if (config.image) {
                document.getElementById('photoContainer').innerHTML = 
                    `<img src="${config.image}" alt="${config.name}" class="polaroid-image">`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            createFloatingElements();
            loadContent();
        });
    </script>
</body>
</html>
