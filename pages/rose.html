<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🌹 Rose Day - For You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared-styles.css">
    <style>
        /* Rose Day Theme - Deep Red + Pink */
        :root {
            --bg-gradient-start: #1a0a0a;
            --bg-gradient-end: #2d0a14;
            --primary-color: #e91e63;
            --secondary-color: #f8bbd9;
            --text-color: #ffffff;
            --accent-color: #ff4081;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 50%, #1a0505 100%);
            color: var(--text-color);
        }

        .day-title {
            color: var(--primary-color);
        }

        .day-date {
            color: var(--secondary-color);
        }

        .message-label {
            color: var(--primary-color);
        }

        .message-section {
            border: 1px solid rgba(233, 30, 99, 0.2);
        }

        .quote-section {
            border-left-color: var(--primary-color);
            color: var(--secondary-color);
        }

        .polaroid-caption {
            color: var(--bg-gradient-end);
        }

        /* Rose petals animation */
        .petal {
            position: fixed;
            width: 15px;
            height: 15px;
            background: linear-gradient(135deg, #e91e63, #f48fb1);
            border-radius: 50% 0 50% 50%;
            transform: rotate(45deg);
            opacity: 0.7;
            animation: fallPetal 10s linear infinite;
            pointer-events: none;
        }

        @keyframes fallPetal {
            0% {
                transform: translateY(-10vh) rotate(45deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(110vh) rotate(405deg) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Rose Petals Animation -->
    <div class="hearts-container" id="petalsContainer"></div>

    <!-- Main Content -->
    <div class="page-container">
        <!-- Header -->
        <div class="day-header">
            <span class="day-emoji">🌹</span>
            <h1 class="day-title">Rose Day</h1>
            <p class="day-date">February 7</p>
        </div>

        <!-- Polaroid Photo -->
        <div class="polaroid-container">
            <div class="polaroid">
                <div id="photoContainer">
                    <div class="polaroid-placeholder">🌹</div>
                </div>
                <p class="polaroid-caption" id="captionName">My Love</p>
            </div>
        </div>

        <!-- Message -->
        <div class="message-section">
            <p class="message-label">For you, <span id="displayName">My Love</span> 💕</p>
            <p class="message-text" id="messageText">
                Like a rose, your beauty and warmth brighten every moment of my life. You are the most beautiful flower in my garden of love.
            </p>
        </div>

        <!-- Quote -->
        <div class="quote-section">
            <p class="quote-text" id="quoteText">
                "A rose speaks of love silently, in a language known only to the heart."
            </p>
        </div>

        <!-- Footer -->
        <div class="page-footer">
            <p class="footer-hearts">🌹💕🌹</p>
            <p>Happy Rose Day!</p>
        </div>
    </div>

    <script src="../config.js"></script>
    <script>
        // Create falling rose petals
        function createPetals() {
            const container = document.getElementById('petalsContainer');
            for (let i = 0; i < 20; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + '%';
                petal.style.animationDuration = (Math.random() * 5 + 8) + 's';
                petal.style.animationDelay = Math.random() * 10 + 's';
                petal.style.transform = `rotate(${Math.random() * 360}deg)`;
                container.appendChild(petal);
            }
        }

        // Load content from config
        function loadContent() {
            const config = ValentineConfig.getDay('rose');
            
            // Update name
            document.getElementById('displayName').textContent = config.name;
            document.getElementById('captionName').textContent = config.name;
            
            // Update message
            if (config.message) {
                document.getElementById('messageText').textContent = config.message;
            }
            
            // Update quote
            if (config.quote) {
                document.getElementById('quoteText').textContent = config.quote;
            }
            
            // Update photo
            if (config.image) {
                document.getElementById('photoContainer').innerHTML = 
                    `<img src="${config.image}" alt="${config.name}" class="polaroid-image">`;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            createPetals();
            loadContent();
        });
    </script>
</body>
</html>
